[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "metadata-rag-studio"
version = "1.0.0"
description = "Structured metadata generation and RAG with optional Llama 2 and FAISS"
requires-python = ">=3.10"

[project.scripts]
metadata-rag = "metadata_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
